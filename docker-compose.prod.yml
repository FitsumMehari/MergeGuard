services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-mergeguard}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env.production}
      POSTGRES_DB: ${POSTGRES_DB:-mergeguard}
    volumes:
      - pg_prod_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-mergeguard} -d ${POSTGRES_DB:-mergeguard}"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks: [mergeguard]

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_prod_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks: [mergeguard]

  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    restart: unless-stopped
    env_file: [.env.production]
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://${POSTGRES_USER:-mergeguard}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-mergeguard}
      REDIS_URL: redis://redis:6379
      API_PORT: 4000
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
    ports:
      - "${API_BIND_HOST:-127.0.0.1}:${API_PUBLIC_PORT:-4000}:4000"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:4000/health/ready').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 10
    networks: [mergeguard]

  worker:
    build:
      context: .
      dockerfile: Dockerfile.worker
    restart: unless-stopped
    env_file: [.env.production]
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://${POSTGRES_USER:-mergeguard}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-mergeguard}
      REDIS_URL: redis://redis:6379
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
    networks: [mergeguard]

  web:
    build:
      context: .
      dockerfile: Dockerfile.web
    restart: unless-stopped
    env_file: [.env.production]
    environment:
      NODE_ENV: production
      API_URL: http://api:4000
    depends_on:
      api: { condition: service_healthy }
    ports:
      - "${WEB_BIND_HOST:-127.0.0.1}:${WEB_PUBLIC_PORT:-3000}:3000"
    networks: [mergeguard]

networks:
  mergeguard:
    driver: bridge

volumes:
  pg_prod_data:
  redis_prod_data:
