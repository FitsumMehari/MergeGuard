services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: mergeguard
      POSTGRES_PASSWORD: mergeguard
      POSTGRES_DB: mergeguard
    ports:
      - "5432:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
volumes:
  pg_data:
  redis_data:
